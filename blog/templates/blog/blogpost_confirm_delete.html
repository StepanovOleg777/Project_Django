{% extends 'blog/base.html' %}

{% block blog_title %}Удаление статьи{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row">
        <div class="col-lg-6 mx-auto">
            <div class="card">
                <div class="card-header">
                    <h5 class="card-title mb-0">Подтверждение удаления</h5>
                </div>
                <div class="card-body">
                    <p>Вы уверены, что хотите удалить статью <strong>"{{ object.title }}"</strong>?</p>
                    <p class="text-muted">Это действие нельзя отменить.</p>

                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-danger">Да, удалить</button>
                            <a href="{% url 'blog:blogpost_detail' object.pk %}" class="btn btn-secondary">Отмена</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
